[package]
name = "ai-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
# Faster incremental debug builds for engine-heavy crates.
split-debuginfo = "unpacked"
